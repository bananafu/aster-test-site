<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grade 11 Required Physics Summer Course | Aster Fu</title>
  <meta name="description" content="Required Physics materials for the Xiufeng Senior High School Grade 11 Summer Course, 2026.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="../../assets/css/custom.css">
  <style>
    :root {
      --deep-green: #29483f;
      --forest-green: #3f6557;
      --paper: #f6f3e9;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--deep-green);
      background:
        radial-gradient(circle at 88% 10%, rgba(235, 244, 235, .9), transparent 28%),
        radial-gradient(circle at 12% 88%, rgba(142, 174, 154, .34), transparent 34%),
        linear-gradient(145deg, #789887 0%, #a8beae 48%, #e0e9e1 100%);
      background-attachment: fixed;
    }

    .course-shell {
      width: min(980px, calc(100% - 48px));
      margin: 0 auto;
      padding: 40px 0 100px;
    }

    .course-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 86px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 22px;
      background: rgba(239,246,239,.36);
      box-shadow: 0 14px 36px rgba(31,59,49,.12);
      backdrop-filter: blur(20px) saturate(125%);
      -webkit-backdrop-filter: blur(20px) saturate(125%);
    }

    .back-link {
      color: var(--deep-green);
      font-size: 14px;
      text-decoration: none;
      opacity: .76;
      transition: opacity .2s ease, transform .2s ease;
    }

    .back-link:hover {
      opacity: 1;
      transform: translateX(-3px);
    }

    .course-header,
    .resource-item {
      border: 1px solid rgba(255,255,255,.58);
      background: rgba(247,250,245,.62);
      box-shadow: 0 26px 72px rgba(31,59,49,.15), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(28px) saturate(125%);
      -webkit-backdrop-filter: blur(28px) saturate(125%);
    }

    .course-header {
      margin-bottom: 30px;
      padding: clamp(32px, 5vw, 56px);
      border-radius: 34px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      color: #60796e;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 1px;
      background: currentColor;
    }

    h1 {
      margin: 0 0 24px;
      font: 400 clamp(44px, 7vw, 78px)/1.03 Georgia, serif;
      letter-spacing: -.045em;
    }

    .course-header p:not(.eyebrow) {
      margin: 0;
      color: #4f6b60;
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.7;
    }

    .course-theme {
      margin-top: 14px !important;
      font-size: 14px !important;
      letter-spacing: .03em;
      opacity: .82;
    }

    .resource-list {
      display: grid;
      gap: 18px;
      padding-top: 6px;
    }

    .resource-item {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 32px;
      min-height: 132px;
      padding: 28px 30px;
      overflow: hidden;
      color: inherit;
      border-radius: 26px;
    }

    .resource-item::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -82px;
      bottom: -105px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(151,181,161,.3), transparent 70%);
      pointer-events: none;
    }

    .resource-link {
      text-decoration: none;
      cursor: pointer;
      transition: transform .25s ease, background .25s ease, box-shadow .25s ease;
    }

    .resource-link:hover {
      transform: translateY(-4px);
      background: rgba(250,252,248,.74);
      box-shadow:
        0 24px 58px rgba(31,59,49,.17),
        inset 0 1px 0 rgba(255,255,255,.94);
    }

    .resource-name {
      margin: 0 0 12px;
      font: 400 clamp(26px, 3vw, 38px)/1.2 Georgia, serif;
      letter-spacing: -.02em;
    }

    .resource-type {
      margin: 0;
      color: #61796f;
      font-size: 14px;
    }

    .download-badge {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 118px;
      padding: 11px 16px;
      color: #f7faf6;
      border-radius: 999px;
      background: var(--deep-green);
      box-shadow: 0 10px 24px rgba(42,76,64,.2);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .download-arrow {
      font-size: 15px;
      transition: transform .2s ease;
    }

    .resource-link:hover .download-arrow {
      transform: translateX(4px);
    }

    @media (max-width: 640px) {
      .course-shell {
        width: min(100% - 28px, 980px);
        padding-top: 18px;
      }

      .course-nav {
        margin-bottom: 66px;
        border-radius: 18px;
      }

      .course-header {
        border-radius: 28px;
      }

      .resource-item {
        grid-template-columns: 1fr;
        gap: 20px;
        min-height: 154px;
        padding: 24px;
        border-radius: 22px;
      }

      .download-badge {
        width: fit-content;
      }
    }
  </style>
</head>
<body>
  <main class="course-shell">
    <nav class="course-nav" aria-label="Course navigation">
      <a class="brand" href="/" aria-label="Aster Fu home">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span><strong>Aster Fu</strong><small>Physics · Teaching</small></span>
      </a>
      <a class="back-link" href="../">← Teaching</a>
    </nav>

    <header class="course-header">
      <p class="eyebrow">Teaching</p>
      <h1>Xiufeng Senior High School</h1>
      <p>Grade 11 Summer Course<br>Required Physics · 2026</p>
      <p class="course-theme">Course materials and classroom resources</p>
    </header>

    <section class="resource-list" aria-label="Course materials">
      <a class="resource-item resource-link" href="slides/5-4 質能互換與核能.pptx" download>
        <div>
          <h2 class="resource-name">5-4 質能互換與核能</h2>
          <p class="resource-type">Slides · PowerPoint</p>
        </div>
        <span class="download-badge">Download <span class="download-arrow" aria-hidden="true">→</span></span>
      </a>
    </section>
  </main>
</body>
</html>
