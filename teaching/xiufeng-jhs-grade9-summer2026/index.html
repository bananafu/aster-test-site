<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grade 9 Summer Course | Aster Fu</title>
  <meta name="description" content="Earth Science slides for Xiufeng Junior High School Grade 9 Summer Course, 2026.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="../../assets/css/custom.css">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 88% 10%, rgba(255,255,255,.78), transparent 32%),
        linear-gradient(150deg, #eef2ee 0%, #f6f3ec 56%, #e8eeea 100%);
      color: var(--ink, #132c28);
    }

    .course-shell {
      width: min(940px, calc(100% - 48px));
      margin: 0 auto;
      padding: 42px 0 96px;
    }

    .course-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 100px;
    }

    .back-link {
      color: inherit;
      font-size: 14px;
      text-decoration: none;
      opacity: .72;
      transition: opacity .2s ease;
    }

    .back-link:hover {
      opacity: 1;
    }

    .course-header {
      padding: 0 0 58px;
      border-bottom: 1px solid var(--line, rgba(19,44,40,.16));
    }

    .course-header .eyebrow {
      margin: 0 0 18px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .55;
    }

    .course-header h1 {
      margin: 0 0 24px;
      font: 400 clamp(44px, 7vw, 78px)/1.03 Georgia, serif;
      letter-spacing: -.045em;
    }

    .course-header p {
      margin: 0;
      color: #456158;
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.7;
    }

    .course-theme {
      margin-top: 14px !important;
      font-size: 14px !important;
      letter-spacing: .03em;
      opacity: .75;
    }

    .resource-list {
      display: grid;
      gap: 18px;
      padding-top: 28px;
    }

    .resource-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 32px;
      min-height: 128px;
      padding: 28px 30px;
      color: inherit;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 24px;
      background: rgba(255,255,255,.48);
      box-shadow:
        0 16px 42px rgba(37,64,55,.09),
        inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(18px) saturate(120%);
      -webkit-backdrop-filter: blur(18px) saturate(120%);
    }

    .resource-name {
      margin: 0 0 12px;
      font: 400 clamp(25px, 3vw, 36px)/1.2 Georgia, serif;
      letter-spacing: -.02em;
    }

    .resource-type {
      margin: 0;
      color: #60766d;
      font-size: 14px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 112px;
      padding: 10px 14px;
      border: 1px solid rgba(19,44,40,.14);
      border-radius: 999px;
      color: #60766d;
      background: rgba(255,255,255,.45);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    @media (max-width: 640px) {
      .course-shell {
        width: min(100% - 32px, 940px);
        padding-top: 28px;
      }

      .course-nav {
        margin-bottom: 72px;
      }

      .course-header {
        padding-bottom: 42px;
      }

      .resource-item {
        grid-template-columns: 1fr;
        gap: 20px;
        min-height: 150px;
        padding: 24px;
      }

      .status-badge {
        width: fit-content;
      }
    }
  </style>
</head>
<body>
  <main class="course-shell">
    <nav class="course-nav" aria-label="Course navigation">
      <a class="brand" href="/" aria-label="Aster Fu home">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span><strong>Aster Fu</strong><small>Earth Science · Teaching</small></span>
      </a>
      <a class="back-link" href="../">← Teaching</a>
    </nav>

    <header class="course-header">
      <p class="eyebrow">Teaching</p>
      <h1>Xiufeng Junior High School</h1>
      <p>Grade 9 Summer Course<br>Earth Science · 2026</p>
      <p class="course-theme">Introduction to Scientific Reasoning</p>
    </header>

    <section class="resource-list" aria-label="Course slides">
      <article class="resource-item">
        <div>
          <h2 class="resource-name">01 自然概論</h2>
          <p class="resource-type">Slides</p>
        </div>
        <span class="status-badge">Coming soon</span>
      </article>

      <article class="resource-item">
        <div>
          <h2 class="resource-name">02 自然概論</h2>
          <p class="resource-type">Slides</p>
        </div>
        <span class="status-badge">Coming soon</span>
      </article>
    </section>
  </main>
</body>
</html>
